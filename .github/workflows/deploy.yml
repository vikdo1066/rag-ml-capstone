on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  id-token: write    # required for WIF
  contents: read
env:
  PROJECT: ${{ vars.PROJECT_ID }}
  REGION: europe-west8
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet
      - run: docker build -t ${REGION}-docker.pkg.dev/${PROJECT}/app-repo/hello:${GITHUB_SHA} .
      - run: docker push ${REGION}-docker.pkg.dev/${PROJECT}/app-repo/hello:${GITHUB_SHA}
      - run: |
          gcloud run deploy hello \
              --image=${REGION}-docker.pkg.dev/${PROJECT}/app-repo/hello:${GITHUB_SHA} \
              --region=${REGION} \
              --quiet